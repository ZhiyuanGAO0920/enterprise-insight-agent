[project]
name = "enterprise-agent-v5"
version = "5.0.0"
description = "Enterprise Multi-Agent Decision Intelligence Platform V5 — 11 agents, 5 business domains, multi-tenant, audit logging, PDF export, structured logging, React frontend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0,<0.3.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
    "openai>=1.55.0,<2.0.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.2.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyyaml>=6.0",
    "sqlparse>=0.5.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
pdf = [
    "weasyprint>=62.0",
    "reportlab>=4.0",
]
email = [
    "aiosmtplib>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
    "ignore:coroutine '.*_cancel' was never awaited:RuntimeWarning",
]
markers = [
    "db: tests that require a running PostgreSQL database",
    "e2e: end-to-end tests requiring real LLM API calls",
]

[tool.setuptools.packages.find]
include = ["app*", "alembic*", "prompts*"]
exclude = ["tests*", "venv312*", "非核心文件*"]
