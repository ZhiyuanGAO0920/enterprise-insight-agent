# A generic, single database configuration.

[alembic]
script_location = alembic
# WARNING: This URL is only a fallback. At runtime, alembic/env.py reads the
# actual connection string from app.config (which loads from .env).
# Make sure DATABASE_URL / DATABASE_URL_SYNC are correctly set in .env.
# To use this INI value directly, inject via env: ALEMBIC_DB_URL
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/enterprise_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
